[package]
name = "signal-matrix-harness"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { path = "../..", features = ["fuzz_macro"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "fuzz_target"
path = "src/bin/fuzz_target.rs"
test = false
doc = false

[[bin]]
name = "fuzz_main"
path = "src/bin/fuzz_main.rs"
test = false
doc = false
